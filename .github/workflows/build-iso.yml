name: Build Pie OS ISO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO in Arch Linux container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash -c '
              pacman-key --init
              pacman-key --populate archlinux
              echo "keyserver hkp://keyserver.ubuntu.com:80" >> /etc/pacman.d/gnupg/gpg.conf
              echo "ParallelDownloads = 5" >> /etc/pacman.conf
              pacman -Syu --noconfirm
              pacman -S --noconfirm archiso base-devel git squashfs-tools xorriso grub mtools
              mkdir -p out
              bash build.sh build
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: pieos-iso
          path: out/*.iso
          compression-level: 0
          if-no-files-found: error
