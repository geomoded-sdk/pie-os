# Pie OS - GRUB config (UEFI)

set default="pieos"
set timeout=5

insmod part_gpt
insmod ext2
insmod fat

menuentry "Pie OS" {
    set gfxpayload=keep
    search --no-floppy --set=root --label PIEOS_
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=PIEOS_ splash quiet vt.global_cursor_default=0 loglevel=3
    initrd /arch/boot/x86_64/intel-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Pie OS (modo seguro)" {
    search --no-floppy --set=root --label PIEOS_
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=PIEOS_ loglevel=3 nomodeset
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Memtest86+" {
    search --no-floppy --set=root --label PIEOS_
    linux /arch/boot/memtest86+/memtest
}
